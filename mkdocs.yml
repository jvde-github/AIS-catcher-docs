site_name: AIS-catcher Docs
site_description: Comprehensive guide to installing, configuring, and using AIS-catcher.
site_author: jvde.github@gmail.com
site_url: https://aiscatcher.org/docs

theme:
  name: 'material'
  custom_dir: overrides
  logo:   assets/logo.svg
  favicon: assets/logo.svg
  language: 'en'
  palette:
    primary: 'blue'
    accent: 'light blue'
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  icon:
    repo: fontawesome/brands/github
    social:
      - icon: fontawesome/brands/github
        link: https://github.com/jvde-github/AIS-catcher
      - icon: fontawesome/brands/twitter
        link: https://x.com/githubjvde
  features:
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.annotate
    - content.code.copy
    - content.code.wrap
    - content.tabs.link

repo_url: https://github.com/jvde-github/AIS-catcher
repo_name: GitHub
extra_css:
  - styles/custom.css
extra_javascript:
  - javascripts/stepper.js

extra:
  social:
    - icon: fontawesome/solid/house
      link: https://aiscatcher.org
    - icon: fontawesome/brands/github
      link: https://github.com/jvde-github/AIS-catcher
    - icon: fontawesome/brands/twitter
      link: https://x.com/githubjvde
    - icon: fontawesome/solid/comments
      link: https://github.com/jvde-github/AIS-catcher/discussions
    - icon: fontawesome/solid/bug
      link: https://github.com/jvde-github/AIS-catcher/issues

  footer:
    text: '© 2021-2026 jvde.github@gmail.com. All rights reserved.'
    links:
      - title: 'License'
        url: 'license.md'
      - title: 'Disclaimer'
        url: 'disclaimer.md'

nav:
  - Home: index.md
  - Get Started:
      - What is AIS?: ais-basics.md
      - What You Need: what-you-need.md
      - Quick Start: getting-started/overview.md
      - Install:
          - All Installs: installation/overview.md
          - Raspberry Pi and Linux: installation/ubuntu-debian.md
          - Windows: installation/windows.md
          - macOS: installation/macos.md
          - Docker: installation/docker.md
          - Build from Source: installation/build-source.md
          - AIS-catcher-control: usage/gui.md
  - Managed Mode:
      - Getting Around: managed/dashboard.md
      - Receiver: managed/input.md
      - Outputs: managed/output.md
      - Remote Access and Security: managed/remote-access.md
      - Guides:
          - Send Ships to Your Chart Plotter: managed/chart-plotter.md
  - Manual Mode:
      - How Manual Mode Works: usage/overview.md
      - Command Line: usage/cli.md
      - Configuration File: usage/json-configuration.md
      - Running as a Service: usage/service.md
      - Guides:
          - Send Ships to Your Chart Plotter: usage/chart-plotter.md
          - Location from GPS: advanced/GPS.md
          - Offline Web Viewer: advanced/offline.md
          - Aircraft (ADS-B): advanced/ADSB.md
          - GNU Radio: advanced/GNUradio.md
          - Grafana: advanced/grafana.md
          - Small Computers: advanced/Low-spec-devices.md
      - Reference:
          - Overview: configuration/overview.md
          - Inputs:
                - Overview: configuration/input/overview.md
                - SDR Devices:
                  - RTL-SDR: configuration/input/rtlsdr.md
                  - AirSpy: configuration/input/airspy.md
                  - AirSpy HF+: configuration/input/airspyhf.md
                  - HackRF: configuration/input/hackrf.md
                  - HydraSDR: configuration/input/hydrasdr.md
                  - SDRPlay: configuration/input/sdrplay.md
                  - SoapySDR: configuration/input/soapysdr.md
                - Network Input:
                  - TCP Client: configuration/input/tcp.md
                  - UDP: configuration/input/udp.md
                  - SpyServer: configuration/input/spyserver.md
                - File Input:
                  - Raw Files: configuration/input/file.md
                  - WAV Files: configuration/input/wav.md
                  - FM Discriminator Audio: advanced/FM-decoding.md
                - Other Input:
                  - Serial Port: configuration/input/serial.md
                  - dAISy Catcher: configuration/input/daisy-catcher.md
                  - NMEA2000: configuration/input/NMEA2000.md
          - Decoding:
              - Model: configuration/model.md
              - Sample Rate: advanced/samplerate.md
          - Outputs:
            - Overview: configuration/output/overview.md
            - Message Filtering: configuration/output/message-filtering.md
            - Community Feed: configuration/output/community-feed.md
            - Console Output: configuration/output/console.md
            - Network Output:
              - TCP Server: configuration/output/TCP-server.md
              - TCP Client: configuration/output/TCP-client.md
              - UDP: configuration/output/UDP.md
              - HTTP: configuration/output/HTTP.md
              - MQTT: configuration/output/MQTT.md
            - Web Viewer: configuration/output/web-viewer.md
            - Places: configuration/output/places.md
            - NMEA2000: configuration/output/NMEA2000.md
            - Database (PostgreSQL / SQLite): configuration/output/PSQL.md
          - Configuration Keys: references/config-keys.md
  - API:
      - Overview: api/overview.md
      - Reference: api/reference.md
      - Webhooks: api/webhooks.md
      - Home Assistant: api/home-assistant.md
      - Python (aiscat): tools/python.md
      - JSON AIS Format: references/JSON-decoding.md
  - Help:
      - Troubleshooting: advanced/troubleshooting.md
      - Community: community.md
      - What is New?: what-is-new.md
      - Features: getting-started/features.md
      - Long Range AIS: advanced/long-range.md
      - Validation: advanced/validation.md
      - License: references/license.md


# Notes for contributors: versioned here, deliberately not on the site.
not_in_nav: |
  /development/*

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.tasklist
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - pymdownx.extra
  - md_in_html
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_alt
  - pymdownx.keys
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true


plugins:
  - search
  - awesome-pages
  - redirects:
      redirect_maps:
        installation/raspberrypi.md: installation/ubuntu-debian.md
        installation/android.md: https://github.com/jvde-github/AIS-catcher-for-Android
        managed/setup-wizard.md: getting-started/overview.md
        usage/online-configuration.md: managed/dashboard.md
        faq.md: usage/chart-plotter.md
        community/overview.md: community.md
        references/overview.md: index.md
